version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    vendor: true
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "area/dependency"
      - "release-note-none"
      - "ok-to-test"
    groups:
      k8s-dependencies:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      cli-libs:
        patterns:
          - "github.com/spf13/*"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "area/dependency"
      - "release-note-none"
      - "ok-to-test"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "area/dependency"
      - "release-note-none"
      - "ok-to-test"
    open-pull-requests-limit: 10
